# Sveltia CMS config.
# This file is published alongside the admin UI — never put secrets here.

backend:
  name: github
  repo: chu-alumni-board/content_cms
  branch: develop
  # Only PAT login is verified working.
  auth_methods: [token]
  commit_messages:
    create: 'content: publish "{{slug}}"'
    update: 'content: update "{{slug}}"'
    delete: 'content: remove "{{slug}}"'

# Required by Sveltia CMS at startup, even though this schema has no image/attachment field.
media_folder: /content/uploads

slug:
  encoding: unicode

collections:
  - name: announcements
    label: 公告
    label_singular: 公告
    folder: /content/announcements
    create: true
    slug: "{{publishedAt | date('YYYYMMDDTHHmmss', 'utc')}}-{{slug}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: 標題, widget: string, required: true }
      # Do not add `format:` here — Sveltia treats non-matching existing values as empty and wipes them on save.
      - {
          name: publishedAt,
          label: 發布時間,
          widget: datetime,
          input_timezone: Asia/Taipei,
          output_utc: true,
          required: true,
        }
      - { name: body, label: 內容, widget: markdown, required: true }
